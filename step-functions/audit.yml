Comment: HM Kardex Audit Workflow

StartAt: ReadAudit

States:

  ReadAudit:
    Type: Task
    Resource:
      Fn::GetAtt:
        - ReadAuditLambdaFunction
        - Arn
    Next: ReadFiles
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: $.error
        Next: FailAudit

  ReadFiles:
    Type: Task
    Resource:
      Fn::GetAtt:
        - ReadFilesLambdaFunction
        - Arn
    Next: ParseFiles
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: $.error
        Next: FailAudit

  ParseFiles:
    Type: Task
    Resource:
      Fn::GetAtt:
        - ParseFilesLambdaFunction
        - Arn

    End: true
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: $.error
        Next: FailAudit

  FailAudit:
    Type: Task
    Resource:
      Fn::GetAtt:
        - FailAuditLambdaFunction
        - Arn
    End: true
